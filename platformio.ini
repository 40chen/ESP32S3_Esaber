; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32@^6.9.0
board = 4d_systems_esp32s3_gen4_r8n16
; CPU at 160 MHz instead of the default 240: the eye render, the audio decode
; and the web console all fit comfortably, and the core's dynamic current drops
; accordingly -- steady-state savings on the 3.3 V rail, which also lowers the
; AMS1117's dissipation.  Single-variable change: if the real hardware stutters
; or the eye framerate is unacceptable, revert this one line and reflash.
board_build.f_cpu = 160000000L
framework = arduino
monitor_speed = 115200

build_flags =
        -D ARDUINO_USB_MODE=1
        ; The audio decoder (64 KB PSRAM buffer) and the eye sprite both assume
        ; PSRAM is initialised; without this flag the 8 MB octal PSRAM stays
        ; unused and they land on the internal heap instead.
        -D BOARD_HAS_PSRAM
        -include include/TFT_eSPI_Setup.h

board_build.partitions = default_16MB.csv
lib_deps = 
        ESP32-audioI2S@^2.0.7
        electroniccats/MPU6050@^1.3.1
        adafruit/Adafruit NeoPixel@^1.12.2
        bodmer/TFT_eSPI@^2.5.43
        ricmoo/QRCode@^0.0.1
        arduino-libraries/Madgwick@^1.2.0
        bblanchon/ArduinoJson@^7.0.4
        file://./lib/arduino-audio-driver-main
