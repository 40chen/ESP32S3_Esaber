; ============================================================================
; ESABER 光剑 · 构建配置
; 目标板：4D Systems gen4-UD 32GB / ESP32-S3 R8N16（8MB PSRAM / 16MB Flash）
; ============================================================================

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32@^6.9.0
board = 4d_systems_esp32s3_gen4_r8n16
; 【改动② · CPU 降频 240→160MHz】（3.3V 供电优化）
; 眼睛渲染、音频解码、web 控制台在 160MHz 下都跑得动，内核动态电流随之下降，
; 3.3V 轨静态功耗降低，AMS1117 的发热也小了。
; 单变量改动：真机若卡顿、眼睛帧率不可接受，删掉本行重新烧录即回滚。
board_build.f_cpu = 160000000L
framework = arduino
monitor_speed = 115200

build_flags =
        -D ARDUINO_USB_MODE=1
        ; 【改动②配套 · 显式声明 PSRAM】
        ; 音频解码器（64KB 缓冲）和眼睛精灵图都假定 PSRAM 已初始化；
        ; 没有这个 flag，8MB 八线 PSRAM 完全不会被启用，
        ; 大缓冲会落到内部堆上（挤占 WiFi/音频栈，导致播放断音）。
        -D BOARD_HAS_PSRAM
        -include include/TFT_eSPI_Setup.h

board_build.partitions = default_16MB.csv
lib_deps =
        ESP32-audioI2S@^2.0.7                        ; I2S 音频解码（wav/flac/mp3）
        electroniccats/MPU6050@^1.3.1                ; IMU 姿态
        adafruit/Adafruit NeoPixel@^1.12.2           ; WS2812 灯条
        bodmer/TFT_eSPI@^2.5.43                      ; GC9A01 圆屏驱动
        ricmoo/QRCode@^0.0.1                         ; 屏上 WiFi 二维码
        arduino-libraries/Madgwick@^1.2.0            ; AHRS 姿态融合
        bblanchon/ArduinoJson@^7.0.4                 ; web API 的 JSON
        file://./lib/arduino-audio-driver-main       ; 本地音频驱动板抽象（ES8311）
